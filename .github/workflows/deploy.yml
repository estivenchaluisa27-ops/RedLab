name: Deploy a Firebase

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:css && git diff --exit-code -- styles.css
      - run: npx vitest run

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare Firebase credentials (SA key JSON, base64, or CI token)
        env:
          RAW_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LAB_REDES_TURNOS }}
        run: |
          TRIMMED="$(printf '%s' "$RAW_KEY" | sed 's/^[[:space:]]*//')"
          if printf '%s' "$TRIMMED" | grep -q '^1//'; then
            echo "FIREBASE_CI_TOKEN=$TRIMMED" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_SA_KEY=$TRIMMED" >> "$GITHUB_ENV"
          fi
      - uses: w9jds/firebase-action@v15.22.4
        with:
          args: deploy --only hosting,firestore:rules
        env:
          GCP_SA_KEY: ${{ env.FIREBASE_SA_KEY }}
          FIREBASE_TOKEN: ${{ env.FIREBASE_CI_TOKEN }}
